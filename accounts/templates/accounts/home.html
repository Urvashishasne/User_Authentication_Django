{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{% static 'accounts/images/wlp.jpg'%}");
            background-size: cover;

        .container {
            background-color: rgba(0,0,0,0.5); /* slight overlay for readability */

            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="container text-center">
    <h1>Welcome to UserAuth Project</h1>
    
    <p class="mt-4">
        <a href="{% url 'signup' %}" class="btn btn-primary btn-lg">Sign Up</a>
        <a href="{% url 'login' %}" class="btn btn-success btn-lg">Login</a>
    </p>
</div>
</body>
</html>
